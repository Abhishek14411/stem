<main class="shell">

    <div class="top-actions"><span class="offline"><span class="offline-dot" aria-hidden="true"></span><span data-i18n="common.offline">Offline · virtual models</span></span><button class="plain-button" id="home-button" type="button" data-i18n="common.classes" data-i18n-aria="common.returnClasses">Classes</button></div>
  </header>

    <button class="nav-button" type="button" data-grade="home" aria-current="page"><span aria-hidden="true">⌂</span> <span data-i18n="common.navHome">Home</span></button>

<script>
(() => {
"use strict";
const modules = [
  {id:"motion-distance",grade:6,title:"Motion and Measurement of Distances",short:"Motion & measuring distance",intro:"Motion is a change in an object's position. Explore a straight track, a circular path and a repeating back-and-forth journey; use the marks to compare distance.",observation:"How does the marked distance change when you change the speed or choose a different kind of path?",note:"A diagrammatic model: the moving marker stands for an object. A metre (m) is the SI unit of length.",controls:[{key:"path",label:"Type of motion",type:"select",value:"Straight line",options:["Straight line","Circular path","Back and forth"]},{key:"speed",label:"Speed",min:1,max:8,step:1,value:3,unit:"m/s"},{key:"distance",label:"Track length",min:2,max:12,step:1,value:8,unit:"m"}],learn:"A ruler is useful for short lengths; a measuring tape can follow curves; a metre scale is one metre long. Smaller lengths may be written in centimetres (cm) or millimetres (mm).",metrics:()=>{const v=vals("motion-distance");return [["Distance travelled",`${v.distance.toFixed(0)} m`],["Speed setting",`${v.speed.toFixed(0)} m/s`],["Path",v.path]]}},
  {id:"light-shadow",grade:6,title:"Light, Shadows and Reflections",short:"Light, shadows & reflection",intro:"Luminous objects make their own light. We see non-luminous objects when light reflects from them. Try different materials and follow how light forms a shadow.",observation:"What happens to the shadow when the object moves closer to the screen? What changes with each material?",note:"Light rays are drawn as straight lines. This simplified sketch is not to scale.",controls:[{key:"demo",label:"Light activity",type:"select",value:"Shadow",options:["Shadow","Pinhole camera","Plane mirror"]},{key:"material",label:"Material",type:"select",value:"Opaque",options:["Transparent","Translucent","Opaque"]},{key:"position",label:"Object position",min:1,max:9,step:1,value:5,unit:"steps"}],learn:"Transparent materials let most light pass through; translucent materials scatter some light; opaque materials block light. A pinhole camera forms an upside-down image. A plane mirror makes an upright virtual image with left and right reversed (lateral inversion).",metrics:()=>{const v=vals("light-shadow");return [["Demo",v.demo],["Material",v.material],["Light source","Luminous"]]}},
  {id:"electric-circuits",grade:6,title:"Electricity and Circuits",short:"Electricity & circuits",intro:"A bulb lights when it is connected in a complete, closed circuit. Explore a virtual cell, wires, bulb and switch; then test which sample materials conduct electricity.",observation:"Does the bulb glow when the switch is open? Which tested materials complete the virtual path?",note:"This is a low-voltage diagram, not a real wiring activity. Never experiment with mains electricity.",controls:[{key:"closed",label:"Switch",type:"toggle",value:true,on:"Closed",off:"Open"},{key:"material",label:"Test material",type:"select",value:"Copper",options:["Copper","Iron","Aluminium","Rubber","Plastic","Wood"]}],learn:"A cell provides electrical energy, connecting wires make a path, the bulb changes electrical energy to light, and a switch opens or closes the path. Metals usually conduct; rubber and many plastics are insulators.",metrics:()=>{const v=vals("electric-circuits");const conducts=["Copper","Iron","Aluminium"].includes(v.material);return [["Circuit",v.closed&&conducts?"Closed":"Incomplete"],["Bulb",v.closed&&conducts?"On":"Off"],[v.material,conducts?"Conductor":"Insulator"]]}},
  {id:"magnets",grade:6,title:"Fun with Magnets",short:"Fun with magnets",intro:"Magnets may occur naturally or be made by people. Explore poles, test familiar materials, and see how a compass needle responds to a nearby magnet.",observation:"Which materials are attracted? What happens when like poles face, compared with unlike poles?",note:"The magnetic field lines in this picture are a simplified drawing; a compass aligns with the field.",controls:[{key:"material",label:"Test material",type:"select",value:"Iron nail",options:["Iron nail","Steel paper clip","Wood","Plastic","Copper coin"]},{key:"poles",label:"Facing poles",type:"select",value:"North + South",options:["North + South","North + North","South + South"]},{key:"care",label:"Care tip",type:"select",value:"Store with keepers",options:["Store with keepers","Keep dry","Avoid repeated dropping"]}],learn:"Like poles repel and unlike poles attract. A compass needle is a small magnet. Natural lodestone is magnetic; bar magnets and horseshoe magnets are made in many shapes. Keep magnets away from delicate electronics and magnetic cards; store suitable bar magnets in pairs with soft-iron keepers.",metrics:()=>{const v=vals("magnets");const magnetic=["Iron nail","Steel paper clip"].includes(v.material);return [["Material",magnetic?"Magnetic":"Not magnetic"],["Poles",v.poles.includes("North + South")?"Attract":"Repel"],["Magnet care",v.care]]}},
  {id:"heat",grade:7,title:"Heat",short:"Heat",intro:"Temperature tells us how hot or cold something is, measured here in degrees Celsius (°C). Compare safe, virtual examples of heat transfer—no real hot objects are used.",observation:"How does the transfer pattern differ for conduction, convection and radiation? Which surface absorbs more radiation?",note:"The animation is conceptual. It does not show real temperatures or require touching hot objects.",controls:[{key:"transfer",label:"Heat transfer",type:"select",value:"Conduction",options:["Conduction","Convection","Radiation"]},{key:"temperature",label:"Warm sample",min:20,max:80,step:5,value:50,unit:"°C"},{key:"surface",label:"Surface colour",type:"select",value:"Dark",options:["Dark","Light"]}],learn:"A clinical thermometer is designed to measure body temperature; a laboratory thermometer measures temperatures in experiments and should be read while its bulb is in the sample. Conduction transfers heat through touching particles, convection by moving fluids, and radiation by waves. Dark surfaces absorb more radiant energy than light ones.",metrics:()=>{const v=vals("heat");return [["Cool reference","20 °C"],["Warm sample",`${v.temperature} °C`],["Transfer",v.transfer]]}},
  {id:"motion-time",grade:7,title:"Motion and Time",short:"Motion & time",intro:"Speed compares distance with time: speed = distance ÷ time. Change the values and compare the slopes on a distance–time graph. A simple pendulum also shows repeating motion.",observation:"How does the graph's slope change when speed increases? What happens to a pendulum's period when its length increases?",note:"The pendulum uses a small-angle model. The distance–time graph assumes steady speed.",controls:[{key:"distance",label:"Distance",min:10,max:100,step:10,value:60,unit:"m"},{key:"time",label:"Time taken",min:2,max:20,step:1,value:10,unit:"s"},{key:"length",label:"Pendulum length",min:.3,max:2,step:.1,value:1,unit:"m"}],learn:"Time is measured in seconds (s), minutes (min) or hours (h). Speed is often measured in metres per second (m/s) or kilometres per hour (km/h). For a small swing, a longer pendulum takes more time for one complete oscillation: T ≈ 2π√(L/g).",metrics:()=>{const v=vals("motion-time");return [["Speed",`${(v.distance/v.time).toFixed(2)} m/s`],["Pendulum period",`${(2*Math.PI*Math.sqrt(v.length/9.8)).toFixed(2)} s`],["Graph slope",`${(v.distance/v.time).toFixed(2)} m/s`]]}},
  {id:"current-effects",grade:7,title:"Electric Current and Its Effects",short:"Current & its effects",intro:"Current can heat a wire and create a magnetic effect. Explore familiar circuit symbols, a conceptual fuse, an electromagnet and an electric bell—entirely in simulation.",observation:"What changes when more current flows? How does the electromagnet change when the coil has more turns?",note:"Virtual low-voltage model only. A fuse is a safety device; never connect this diagram to a mains supply.",controls:[{key:"effect",label:"Demonstration",type:"select",value:"Heating effect",options:["Heating effect","Electromagnet","Electric bell","Circuit symbols"]},{key:"current",label:"Current setting",min:1,max:8,step:1,value:3,unit:"A"},{key:"turns",label:"Coil turns",min:5,max:30,step:5,value:15,unit:"turns"}],learn:"A fuse melts and breaks a circuit if excessive current flows. An electromagnet is a coil carrying current, often wrapped around an iron core. In an electric bell, an electromagnet attracts a moving arm, repeatedly making and breaking contact.",metrics:()=>{const v=vals("current-effects");return [["Demo",v.effect],["Current setting",`${v.current} A`],["Coil turns",`${v.turns}`]]}},
  {id:"light",grade:7,title:"Light",short:"Light",intro:"Light reflects from mirrors and bends when it passes between materials. Explore a ray sketch for mirrors and lenses, or split white light into the colours of a rainbow.",observation:"How does the image differ when you switch the optical element? What do the prism colours tell you about white light?",note:"Ray diagrams are simplified and not to scale; curved optical surfaces are drawn schematically.",controls:[{key:"element",label:"Optical element",type:"select",value:"Plane mirror",options:["Plane mirror","Concave mirror","Convex mirror","Convex lens","Concave lens","Prism"]},{key:"object",label:"Object distance",min:1,max:8,step:1,value:4,unit:"units"},{key:"size",label:"Object height",min:1,max:4,step:1,value:2,unit:"units"}],learn:"A plane mirror forms an upright virtual image of the same size, apparently as far behind the mirror as the object is in front. A concave mirror or convex lens can form a real image when the object is beyond the focus; a convex mirror and concave lens form upright, smaller virtual images. A prism separates white light into a spectrum of seven colours.",metrics:()=>{const v=vals("light");const virtual=["Plane mirror","Convex mirror","Concave lens"].includes(v.element)||v.element==="Prism";return [["Element",v.element],["Image (typical)",virtual?"Virtual":"Can be real"],["Object distance",`${v.object} units`]]}},
  {id:"electric-effects",grade:8,title:"Electricity: Heating, Magnetic, and Chemical Effects",short:"Electricity: three effects",intro:"Electric current can produce heating, magnetic and chemical effects. Explore a virtual circuit and see how a conducting liquid can support electroplating.",observation:"Which sample liquid allows current in this model? What changes on the object when the electroplating activity is selected?",note:"Conceptual simulation only. Do not handle real electricity or chemicals. Sample results are simplified examples.",controls:[{key:"demo",label:"Effect",type:"select",value:"Heating",options:["Heating","Magnetic","Liquid conduction","Electroplating"]},{key:"liquid",label:"Sample liquid",type:"select",value:"Salt solution",options:["Salt solution","Lemon solution","Distilled water","Vegetable oil"]},{key:"closed",label:"Virtual switch",type:"toggle",value:true,on:"Closed",off:"Open"}],learn:"Some liquids conduct because they contain charged particles. When current passes through a suitable solution, chemical changes can happen. In electroplating, a thin metal coating is deposited on an object. The model shows the idea only; real electroplating requires trained supervision and safe equipment.",metrics:()=>{const v=vals("electric-effects");const conducts=["Salt solution","Lemon solution"].includes(v.liquid);return [["Selected effect",v.demo],["Liquid",conducts?"Conducting model":"Poor conductor model"],["Coating",v.demo==="Electroplating"&&v.closed&&conducts?"Depositing":"Not depositing"]]}},
  {id:"forces",grade:8,title:"Exploring Forces",short:"Exploring forces",intro:"A force is a push or pull. It can change an object's motion or shape. Compare contact forces, such as a push or friction, with forces that act without touching.",observation:"Which forces need touching? Which can act across a gap? How does friction change the moving object's motion?",note:"Arrows show force direction and relative size, not exact measured forces.",controls:[{key:"force",label:"Force example",type:"select",value:"Muscular push",options:["Muscular push","Friction","Magnetic","Electrostatic","Gravitational"]},{key:"strength",label:"Force strength",min:1,max:10,step:1,value:5,unit:"N"},{key:"surface",label:"Surface",type:"select",value:"Rough",options:["Rough","Smooth"]}],learn:"Muscular force and friction are contact forces. Magnetic, electrostatic and gravitational forces are non-contact forces. Friction usually opposes sliding; a rougher surface often creates more friction. Gravity pulls objects towards Earth.",metrics:()=>{const v=vals("forces");const contact=["Muscular push","Friction"].includes(v.force);return [["Force",v.force],["Type",contact?"Contact":"Non-contact"],["Strength",`${v.strength} N`]]}},
  {id:"pressure-weather",grade:8,title:"Pressure, Winds, Storms, and Cyclones",short:"Pressure, wind & cyclones",intro:"Pressure is force spread over an area: pressure = force ÷ area. Explore surface pressure, fluid pressure, wind currents and a conceptual cyclone.",observation:"How does pressure change when you spread the same force over a larger area? How does fluid pressure change with depth?",note:"Weather drawings are simplified learning models, not forecasts or warnings. Follow local emergency guidance in real storms.",controls:[{key:"demo",label:"Model",type:"select",value:"Surface pressure",options:["Surface pressure","Fluid pressure","Wind currents","Cyclone"]},{key:"force",label:"Force",min:10,max:100,step:10,value:50,unit:"N"},{key:"area",label:"Area",min:1,max:10,step:1,value:5,unit:"cm²"},{key:"depth",label:"Fluid depth",min:1,max:10,step:1,value:4,unit:"m"}],learn:"For the same force, a smaller area means greater pressure. Air around us also exerts atmospheric pressure. Fluids exert pressure in all directions, and pressure increases with depth. Uneven heating of air can create convection currents and winds. A cyclone is a rotating storm around a low-pressure centre; this model does not predict weather. During severe weather, shelter indoors and follow official local advice.",metrics:()=>{const v=vals("pressure-weather");return [["Surface pressure",`${(v.force/v.area).toFixed(1)} N/cm²`],["Depth setting",`${v.depth} m`],["Wind model",v.demo==="Cyclone"?"Low-pressure centre":"Conceptual"]]}},
  {id:"sound",grade:8,title:"Sound",short:"Sound",intro:"Sound begins with vibrations and travels through a medium such as air, water or a solid. Adjust frequency and amplitude to explore pitch and loudness.",observation:"How does frequency affect pitch? How does amplitude affect loudness? What happens to sound when there is no medium?",note:"Wave shape and loudness are illustrative, not calibrated sound measurements. Keep real listening volumes comfortable.",controls:[{key:"medium",label:"Medium",type:"select",value:"Air (gas)",options:["Air (gas)","Water (liquid)","Solid","No medium"]},{key:"frequency",label:"Frequency",min:5,max:30000,step:5,value:440,unit:"Hz"},{key:"amplitude",label:"Amplitude",min:1,max:10,step:1,value:5,unit:"relative"},{key:"soundtype",label:"Compare",type:"select",value:"Music",options:["Music","Noise"]}],learn:"Frequency is the number of vibrations each second; higher frequency usually means higher pitch. Larger amplitude usually means louder sound. The voice box (larynx) vibrates to make voice. The outer ear collects sound; the eardrum vibrates and the tiny middle-ear bones pass that motion to the inner ear (cochlea), which sends signals along the auditory nerve. Sound cannot travel through a vacuum. Human hearing is roughly 20 Hz to 20,000 Hz; infrasound is below that range and ultrasound is above it. Very loud noise can harm hearing.",metrics:()=>{const v=vals("sound");return [["Pitch",v.frequency>1000?"High":v.frequency<200?"Low":"Mid-range"],["Loudness",v.amplitude>6?"Louder":"Softer"],["Hearing range",v.frequency<20?"Infrasound":v.frequency>20000?"Ultrasound":"Audible range"]]}},
  {id:"reflection-eye",grade:8,title:"Light: Reflection and the Human Eye",short:"Reflection & the human eye",intro:"Smooth surfaces reflect light in an orderly way; rough surfaces scatter it. Explore two mirrors and see a simple diagram of how the eye focuses light.",observation:"What happens to the number of reflected images as the mirror angle gets smaller? How does roughness change reflection?",note:"Mirror-image counts are ideal geometry; eye diagram is simplified and not to scale.",controls:[{key:"surface",label:"Reflecting surface",type:"select",value:"Smooth mirror",options:["Smooth mirror","Rough surface"]},{key:"mirrorAngle",label:"Angle between mirrors",min:20,max:180,step:10,value:90,unit:"°"},{key:"rays",label:"Incoming rays",min:1,max:5,step:1,value:3,unit:"rays"}],learn:"The cornea and lens bend light to focus an image on the retina. The iris controls pupil size; the optic nerve carries signals to the brain. Read in good light, take screen breaks, and never look directly at the Sun or bright lasers. Regular reflection comes from a smooth surface; a rough surface scatters reflected rays.",metrics:()=>{const v=vals("reflection-eye");return [["Surface",v.surface],["Mirror angle",`${v.mirrorAngle}°`],["Reflection",v.surface==="Rough surface"?"Scattered":"Regular"]]}},
  {id:"natural-phenomena",grade:8,title:"Some Natural Phenomena",short:"Some natural phenomena",intro:"Rubbing can transfer electric charge; charge interactions and lightning can be modelled safely here. Earthquakes begin when parts of Earth's crust move, sending waves from an underground focus.",observation:"How do like and unlike charges interact? Where do earthquake waves begin, and where is the epicentre?",note:"Lightning and earthquake drawings are conceptual—not forecasts, warnings or safety substitutes.",controls:[{key:"demo",label:"Explore",type:"select",value:"Charging by rubbing",options:["Charging by rubbing","Charge interaction","Lightning","Earthquake waves"]},{key:"charge",label:"Charge amount",min:1,max:8,step:1,value:4,unit:"units"},{key:"relation",label:"Charge pair",type:"select",value:"Unlike (+ / −)",options:["Unlike (+ / −)","Like (+ / +)"]}],learn:"Rubbing can transfer electrons between some materials, leaving opposite charges. Unlike charges attract; like charges repel. Lightning is a huge electrical discharge—during a storm go indoors, away from windows, and avoid open areas, tall isolated objects and water. During an earthquake: Drop, Cover and Hold On; if outside, move to an open area away from buildings and wires. Follow local authorities.",metrics:()=>{const v=vals("natural-phenomena");return [["Model",v.demo],["Charges",v.relation.startsWith("Unlike")?"Attract":"Repel"],["Earthquake origin","Underground focus"]]}},
];

const gradeInfo={6:{name:"Class 6",description:"Discover motion, light, simple circuits and magnets.",ids:["motion-distance","light-shadow","electric-circuits","magnets"]},7:{name:"Class 7",description:"Explore heat, motion and time, current effects and light.",ids:["heat","motion-time","current-effects","light"]},8:{name:"Class 8",description:"Investigate electricity, forces, weather, sound, light and natural phenomena.",ids:["electric-effects","forces","pressure-weather","sound","reflection-eye","natural-phenomena"]}};
const explanations={
  "motion-distance":v=>`The orange dot is a moving object. Its track marks are a ruler scale: each mark shows distance in metres (m), and smaller lengths can be measured in centimetres (cm) or millimetres (mm). The motion menu changes the path to a straight, circular or repeating back-and-forth path. Speed changes how quickly the dot moves; track length changes the marked distance. In real life, a ruler, tape measure or metre scale is used to measure. This drawing is not to scale.`,
  "light-shadow":v=>`The yellow lamp makes light; the orange object does not make its own light, so we see it when light reflects from it. ${v.demo==="Shadow"?`The rays travel in straight lines. ${v.material==="Opaque"?"An opaque object blocks the rays and makes a dark shadow.":v.material==="Translucent"?"A translucent object scatters some light, so its shadow is softer.":"A transparent object lets most light pass, so there is little dark shadow."} Moving the object changes the shadow on the screen.`:v.demo==="Pinhole camera"?"The small hole lets a few straight rays cross. They form an upside-down image on the back of the camera.":"The flat mirror reflects the rays. The image appears behind the mirror, upright and left-right reversed; it is virtual, not a picture you can catch on a screen."} Change the material, object position or activity to compare. The ray drawing is simplified.`,
  "electric-circuits":v=>`The cell's long and short lines represent its positive and negative ends. The green lines are wires, the switch opens or closes the path, the orange sample is the tested material, and the bulb glows only when the path is closed and the sample conducts. Metals such as ${v.material} usually conduct; rubber, plastic and dry wood are insulators. Change the switch or sample to test the idea. This is a safe, low-voltage diagram, not real wiring.`,
  "magnets":v=>`The red half is the north pole (N) and the blue half is the south pole (S). The curved marks and arrows show the interaction: unlike poles attract and like poles repel. The sample bar changes colour to show whether ${v.material} is attracted in this simple test. The small needle is a compass; it lines up roughly north–south because Earth acts like a giant magnet. Change the facing poles or test material. Real magnetic fields are three-dimensional, so this sketch is only a guide.`,
  "heat":v=>`The number is a temperature in degrees Celsius (°C); the cool reference is 20 °C. The moving dots stand for tiny particles. ${v.transfer==="Conduction"?"In conduction, energy passes between neighbouring particles in a solid.":v.transfer==="Convection"?"In convection, warmer parts of a liquid or gas move up and cooler parts move down.":"In radiation, energy travels as waves from the warm source; it does not need air or touching."} Dark surfaces absorb more radiation than light surfaces. Change the transfer type, temperature or surface colour to compare. Thermometers measure temperature: clinical ones are for body temperature, laboratory ones for experiments. No real heat is used here.`,
  "motion-time":v=>`The graph's horizontal axis is time (s); its vertical axis is distance (m). The green line shows the journey and its slope represents speed: a steeper line means faster motion. When running, the orange dot marks progress along the journey. The orange bob is a pendulum; each swing repeats, and the length control changes its period (time for one full swing). Distance divided by time gives average speed in m/s. This graph assumes steady speed, and the pendulum uses a small-swing model.`,
  "current-effects":v=>`${v.effect==="Circuit symbols"?"The simple marks stand for a cell, bulb, switch, wire and fuse.":"The animated parts are a wire, coil or bell mechanism. A glowing wire represents heating by current; a coil around an iron core represents an electromagnet; in a bell, the magnet pulls an arm so the contact can make and break."} The current control changes the modelled heating strength, while more coil turns make a stronger electromagnet in this simplified model. A fuse melts to break a circuit if too much current flows. These are symbols and concepts, not mains wiring.`,
  "light":v=>`${v.element==="Prism"?"The pale ray is white light; the coloured rays show it spreading into seven colours in a prism.":"Gold rays show incoming light, green rays show reflected or refracted light, and the blue arrow marks an image. The object-distance and height controls move or resize the object. A plane mirror makes an upright virtual image; curved mirrors and lenses can make real or virtual images depending on the object position."} Select another mirror, lens or prism to compare. Ray diagrams use ideal surfaces and are not to scale.`,
  "electric-effects":v=>`The cell, wires and switch form a virtual circuit. The container and two electrodes represent a liquid sample; particles in a conducting liquid let current pass. ${v.liquid==="Salt solution"||v.liquid==="Lemon solution"?"This sample is shown as conducting.":"This sample is shown as a poor conductor."} With the switch closed, current can produce heating or a magnetic effect. In electroplating, a thin metal layer is deposited on the object. Choose a different effect or liquid to see the model change. Real liquids and electricity can be hazardous; this is only a diagram.`,
  "forces":v=>`${v.force==="Muscular push"?"The arrow is a hand's push on the blue object; touching makes it a contact force.":v.force==="Friction"?"The opposing arrows show friction resisting sliding; friction is a contact force, and a rough surface usually gives more friction than a smooth one.":`The blue object and ${v.force==="Magnetic"?"magnet":"charged object or Earth"} are separated. ${v.force} is a non-contact force, so it can act without touching.`} Change the force menu, strength or surface. The arrows show direction and relative size, not exact measured forces; a force can change motion or shape.`,
  "pressure-weather":v=>`${v.demo==="Surface pressure"?`The block presses on the outlined area. Pressure = force ÷ area, so spreading the same force over more area lowers pressure. The air around us also pushes in every direction; this is atmospheric pressure.`:v.demo==="Fluid pressure"?`The blue region is liquid. The arrows get longer lower down to show that fluid pressure increases with depth; the depth control changes the labels and arrows.`:v.demo==="Wind currents"?"The warm orange region heats nearby air; warm air rises and cooler air moves in, making a circulation that can create wind.":"The curved blue paths represent fast rotating winds around a low-pressure centre. The centre is labelled; the motion is a concept, not a weather prediction."} Adjust force, area, depth or model to compare. The weather pictures are greatly simplified and are not forecasts.`,
  "sound":v=>`The moving line is a sound wave: frequency (Hz) changes how close its waves are and represents pitch; amplitude changes wave height and represents loudness. The dots are particles in a medium. ${v.medium==="No medium"?"With no medium, sound cannot travel.":"Sound vibrations pass from particle to particle through "+v.medium.toLowerCase()+"."} The wave changes with the frequency, amplitude and music/noise controls. The small voice-box sketch shows where voice vibrations start; the ear labels show the outer ear, eardrum, tiny bones, cochlea and nerve. Human hearing is roughly 20–20,000 Hz. This drawing makes no real sound and its loudness is not calibrated.`,
  "reflection-eye":v=>`${v.surface==="Smooth mirror"?"The gold rays bounce from a smooth surface in an orderly way; this is regular reflection.":"The teal rays spread in different directions from a rough surface; this is diffused reflection."} The small angled mirrors and blue dots represent repeated reflections; changing their angle changes the approximate number of images. In the eye, the cornea and lens focus light on the retina; the iris controls the pupil, and the optic nerve carries signals to the brain. Change the surface, mirror angle or number of rays. Both diagrams are simplified, not to scale.`,
  "natural-phenomena":v=>`${v.demo==="Charging by rubbing"||v.demo==="Charge interaction"?`The plus and minus signs represent electric charges. Rubbing can transfer electrons between materials; opposite charges attract and like charges repel. The charge slider changes the number of signs shown.`:v.demo==="Lightning"?"The charged cloud and jagged bolt represent charge separation and a sudden electrical discharge to the ground. Lightning is much more complex than this drawing.":"The orange underground dot is the earthquake focus, where the shaking starts; the surface point above it is the epicentre. Expanding curves are seismic waves moving through Earth."} Change the model or charge pair to compare. Lightning and earthquake models are not forecasts or safety guides.`
};

        return {
          formula:f2('rule'),
          substitution:f2('sub',{force:valueText(v.force),setting:v.strength,surface:valueText(v.surface.toLowerCase()),offset}),
          result:f2('res',{setting:v.strength,offset}),
          meaning:f2('meaning'),
          example:f2('example'),
          note:f2('note')
        };
      }
      const f2=(k,p)=>tr('formula.forces.other.'+k,p);
      return {
        formula:f2('rule'),
        substitution:f2('sub',{force:valueText(v.force),surface:valueText(v.surface.toLowerCase()),setting:v.strength}),
        result:f2('res',{force:valueText(v.force),type:contact?tr('phrase.contact'):tr('phrase.nonContact')}),
        meaning:f2('meaning'),
        example:f2('example'),
        note:f2('note')
      };
    }
    case "pressure-weather":{
      if(v.demo==="Surface pressure"){
        const pressure=v.force/v.area;
        const f2=(k,p)=>tr('formula.pressure-weather.surface.'+k,p);
        return {
          formula:f2('rule'),
          substitution:f2('sub',{force:v.force,area:v.area,pressure:formulaNumber(pressure,1)}),
          result:f2('res',{pressure:formulaNumber(pressure,1)}),

          note:f2('note')

      }

        return {
          formula:f2('rule'),
          substitution:f2('sub',{depth:v.depth,arrowLength:reach}),
          result:f2('res',{depth:v.depth,arrowLength:reach}),
          meaning:f2('meaning'),
          example:f2('example'),
          note:f2('note')
        };
      }
      if(v.demo==="Cyclone"){
        const angle=t*.12;
        const f2=(k,p)=>tr('formula.pressure-weather.cyclone.'+k,p);
        return {
          formula:f2('rule'),
          substitution:f2('sub',{time:formulaNumber(t),rotation:formulaNumber(angle)}),
          result:f2('res',{rotation:formulaNumber(angle)}),
          meaning:f2('meaning'),
          example:f2('example'),
          note:f2('note')
        };
      }
      const f2=(k,p)=>tr('formula.pressure-weather.wind.'+k,p);
      return {
        formula:f2('rule'),
        substitution:f2('sub',{demo:valueText(v.demo)}),
        result:f2('res'),
        meaning:f2('meaning'),
        example:f2('example'),
        note:f2('note')
      };
    }
    case "sound":{
      const frequency=v.frequency,period=1/frequency,amplitude=v.amplitude*3.1;
      const range=frequency<20?tr('phrase.infrasound'):frequency>20000?tr('phrase.ultrasound'):tr('phrase.audible');
      return {
        formula:fi('rule'),
        substitution:fi('sub',{frequency,period:formulaNumber(period,6),amplitude:v.amplitude,visualAmplitude:formulaNumber(amplitude,1),medium:valueText(v.medium),soundtype:valueText(v.soundtype)}),
        result:fi('res',{periodMs:formulaNumber(period*1000,3),visualAmplitude:formulaNumber(amplitude,1),range:v.medium==="No medium"?tr('phrase.noMedium'):range}),
        meaning:fi('meaning'),
        example:fi('example',{frequency,periodMs:formulaNumber(period*1000,2)}),
        note:fi('note')
      };
    }
    case "reflection-eye":{
      const idealCount=Math.max(1,Math.ceil(360/v.mirrorAngle)-1),shownCount=Math.min(idealCount,10);
      return {
        formula:fi('rule'),
        substitution:fi('sub',{angle:v.mirrorAngle,idealCount,rays:v.rays,surface:valueText(v.surface)}),
        result:fi('res',{idealCount,shownCount}),
        meaning:fi('meaning'),
        example:fi('example',{angle:v.mirrorAngle,idealCount}),
        note:fi('note')
      };
    }
    case "natural-phenomena":{
      if(v.demo==="Earthquake waves"){
        const radius=(t*38)%130;
        const f2=(k,p)=>tr('formula.natural-phenomena.earthquake.'+k,p);
        return {
          formula:f2('rule'),
          substitution:f2('sub',{time:formulaNumber(t),radius:formulaNumber(radius,1)}),
          result:f2('res',{radius:formulaNumber(radius,1)}),
          meaning:f2('meaning'),
          example:f2('example'),
          note:f2('note')
        };
      }
      if(v.demo==="Charging by rubbing"){
        const f2=(k,p)=>tr('formula.natural-phenomena.rubbing.'+k,p);
        return {
          formula:f2('rule'),
          substitution:f2('sub',{charge:v.charge}),
          result:f2('res',{charge:v.charge}),
          meaning:f2('meaning'),
          example:f2('example'),
          note:f2('note')
        };
      }
      if(v.demo==="Charge interaction"){
        const action=v.relation.startsWith("Unlike")?tr('phrase.attracting'):tr('phrase.repelling');
        const f2=(k,p)=>tr('formula.natural-phenomena.interaction.'+k,p);
        return {
          formula:f2('rule'),
          substitution:f2('sub',{relation:valueText(v.relation),charge:v.charge}),
          result:f2('res',{action}),
          meaning:f2('meaning'),
          example:f2('example'),
          note:f2('note')
        };
      }
      const f2=(k,p)=>tr('formula.natural-phenomena.lightning.'+k,p);
      return {
        formula:f2('rule'),
        substitution:f2('sub',{demo:valueText(v.demo),time:formulaNumber(t)}),
        result:f2('res'),
        meaning:f2('meaning'),
        example:f2('example'),
        note:f2('note')
      };
    }
    default:{
      const f2=(k)=>tr('formula.default.'+k);
      return {formula:f2('rule'),substitution:f2('sub'),result:f2('res'),meaning:f2('meaning'),example:f2('example'),note:f2('note')};
    }
  }
}

function saveComparison(){

    comparison.first=snapshot;comparison.second=null;
    status.textContent=tr('common.settingASaved');
    button.textContent=tr('common.compare');
  }else{
    const firstVals=JSON.stringify(comparison.first.controlValues);
    const snapVals=JSON.stringify(snapshot.controlValues);

    status.textContent=tr('common.compareBelow');
    button.textContent=tr('common.anotherSetting');

 else if(v.force==="Friction"){arrow(cx+112,cy+23,cx+48,cy+23,"#ff9b86",3);arrow(cx-130,cy,cx-48,cy,"#69e0c1",2);text(v.surface==="Rough"?"rough · more friction":"smooth · less friction",cx,cy+60,"#c2cecf",9,"center");}
 else{const label={Magnetic:"magnet",Electrostatic:"charged object",Gravitational:"Earth"}[v.force];circle(cx-110,cy,18,v.force==="Magnetic"?"#759fe0":v.force==="Electrostatic"?"#d18ad6":"#7cc59c");text(label,cx-110,cy+34,"#c2ced0",9,"center");arrow(cx-84,cy,cx-42,cy,"#ffb66d",2);text("acts across a gap · non-contact",cx,cy+66,"#c2ced0",9,"center");}
 text(`Force strength: ${force} N (illustrative)`,cx,h-24,"#b7c6c8",10,"center");text("A force can change motion or shape",cx,35,"#c2d0d1",10,"center");
}
function drawPressure(v,w,h){
 if(v.demo==="Surface pressure"){const y=h*.62;ctx.fillStyle="#899ba0";ctx.fillRect(w*.32,y,w*.36,14);ctx.fillStyle="#d0a876";ctx.fillRect(w*.45,y-65,w*.1,65);arrow(w*.5,y-95,w*.5,y-68,"#ffb66d",3);const width=20+v.area*10;ctx.strokeStyle="#69e0c1";ctx.setLineDash([4,4]);ctx.strokeRect(w*.5-width/2,y-8,width,24);ctx.setLineDash([]);text(`Force = ${v.force} N`,w*.5,y-106,"#c4d0d1",10,"center");text(`Area = ${v.area} cm²  ·  Pressure = ${(v.force/v.area).toFixed(1)} N/cm²`,w*.5,y+46,"#c3d0d2",10,"center");text("Air around us also exerts atmospheric pressure",w*.5,y+67,"#aebfc1",9,"center");}
 else if(v.demo==="Fluid pressure"){const x=w*.33,y=h*.22;ctx.fillStyle="#183a49";ctx.fillRect(x,y,w*.34,h*.6);ctx.strokeStyle="#90b6bd";ctx.strokeRect(x,y,w*.34,h*.6);for(let i=0;i<5;i++){const d=(i+1)/6,reach=18+v.depth*4;arrow(x+w*.38,y+d*h*.6,x+w*.38+reach,y+d*h*.6,"#74bed0",1+d*2);text(`depth ${Math.round(v.depth*d)} m`,x+w*.57,y+d*h*.6+3,"#b6c8ca",8);}text("fluid pressure increases with depth",w*.5,h*.14,"#c2d0d1",10,"center");}
 else if(v.demo==="Wind currents"){circle(w*.5,h*.5,33,"#ffb66d");for(let i=0;i<6;i++){const a=i*Math.PI/3+state.elapsed*.35;arrow(w*.5+Math.cos(a)*48,h*.5+Math.sin(a)*35,w*.5+Math.cos(a)*105,h*.5+Math.sin(a)*62,"#8ebcff",2);}text("uneven heating → moving air → wind",w*.5,h*.84,"#c2d0d1",10,"center");}
 else{const cx=w*.5,cy=h*.53;for(let i=0;i<6;i++){const r=27+i*22;ctx.beginPath();ctx.ellipse(cx,cy,r,r*.48,state.elapsed*.12,0,Math.PI*2);ctx.strokeStyle=`rgba(142,188,255,${.8-i*.09})`;ctx.lineWidth=2;ctx.stroke();}text("LOW PRESSURE",cx,cy+4,"#ffbca8",9,"center");text("Cyclone model · not a forecast",cx,h-22,"#ffcf91",10,"center");}
}
function drawSound(v,w,h){
 const cx=w*.51,cy=h*.46,amp=v.amplitude*3.1,freq=v.frequency;
 const cycles=2+Math.log10(Math.max(freq,10)/10)*1.65;
 line(w*.12,cy,w*.88,cy,"#637b83",1,[3,5]);ctx.beginPath();ctx.strokeStyle=v.soundtype==="Noise"?"#ffb66d":"#72ddc0";ctx.lineWidth=2.5;for(let x=w*.13;x<w*.88;x+=2){const phase=(x-w*.13)/w*cycles*Math.PI*2+state.elapsed*2;const wave=v.soundtype==="Noise"?(Math.sin(phase)+.35*Math.sin(phase*2.7)+.18*Math.sin(phase*4.1))/1.53:Math.sin(phase);const y=cy-wave*amp;if(x===w*.13)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();
 text(`${v.soundtype} · ${freq} Hz · amplitude ${v.amplitude}`,w*.5,cy-amp-19,"#c1d0d1",10,"center");
 const mediumX=w*.51,mediumY=h*.75;for(let r=0;r<4;r++)for(let c=0;c<16;c++){const move=state.running&&v.medium!=="No medium"?Math.sin(state.elapsed*4+c*.6+r)*3:0;circle(mediumX-115+c*15+move,mediumY-19+r*13,2.1,v.medium==="No medium"?"#52636b":"#87b6bd");}
 text(v.medium==="No medium"?"No medium · sound cannot travel":`Vibrations through ${v.medium.toLowerCase()}`,mediumX,mediumY+48,"#bccacc",9,"center");
 const bx=w*.13,by=h*.72;ctx.strokeStyle="#d8a777";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(bx,by-33);ctx.quadraticCurveTo(bx+13,by,bx,by+33);ctx.stroke();line(bx-14,by-27,bx-14,by+27,"#d8a777",2);text("voice box",bx,by+51,"#c6d1d1",8,"center");
 const ex=w*.88,ey=h*.72;ctx.strokeStyle="#d4b992";ctx.lineWidth=3;ctx.beginPath();ctx.arc(ex,ey,17,-1,1);ctx.stroke();line(ex-10,ey-23,ex-10,ey+23,"#d4b992",2);text("ear",ex,ey+44,"#c6d1d1",8,"center");
 text(v.frequency<20?"Infrasound · below usual hearing range":v.frequency>20000?"Ultrasound · above usual hearing range":"Within usual human hearing range",w*.5,35,"#c2d0d1",10,"center");
}
function drawEye(v,w,h){
 const left=w*.12,right=w*.56,cy=h*.53;
 if(v.surface==="Smooth mirror"){const n=v.rays;for(let i=0;i<n;i++){const y=cy+(i-(n-1)/2)*17;arrow(left,y,right,y-35,"#ffce87",1.6);arrow(right,y-35,left,y-70,"#69e0c1",1.4);}line(right,cy-90,right,cy+28,"#e2eeeb",3);text("smooth mirror · regular reflection",w*.34,cy+58,"#bdcaca",9,"center");}
 else{line(left,cy-35,right,cy-35,"#d8e4e0",5);for(let i=0;i<v.rays;i++){const y=cy-35+(i-(v.rays-1)/2)*5;arrow(left,y,right,y-3,"#ffcc82",1.5);for(let j=0;j<3;j++){const a=(j-1)*.45;arrow(right,y,right+45*Math.cos(a),y+45*Math.sin(a),"#74d7be",1.2);}}text("rough surface · scattered rays",w*.34,cy+40,"#bdcaca",9,"center");}
 const apex=w*.3,mirrorY=h*.78,angle=v.mirrorAngle*Math.PI/180,arm=35,half=Math.min(angle/2,Math.PI*.42);
 line(apex,mirrorY,apex-arm*Math.cos(half),mirrorY+arm*Math.sin(half),"#e2eeeb",2);
 line(apex,mirrorY,apex-arm*Math.cos(half),mirrorY-arm*Math.sin(half),"#e2eeeb",2);
 const imageCount=Math.max(1,Math.ceil(360/v.mirrorAngle)-1);
 for(let i=0;i<Math.min(imageCount,10);i++){const a=(i/Math.max(imageCount,1))*Math.PI*2;circle(apex+Math.cos(a)*20,mirrorY+Math.sin(a)*20,2.5,"#8ebcff");}
 text(`Two mirrors · ${v.mirrorAngle}° · about ${imageCount} images`,apex,mirrorY+41,"#c0cecf",7,"center");
 const eyeScale=Math.min(1,w/520),ex=Math.min(w*.8,w-180*eyeScale),ey=cy;
 ctx.fillStyle="#29404b";ctx.beginPath();ctx.ellipse(ex,ey,69*eyeScale,39*eyeScale,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#a5c1c4";ctx.lineWidth=2;ctx.stroke();
 ctx.fillStyle="#8bd0d1";ctx.beginPath();ctx.ellipse(ex-13*eyeScale,ey,16*eyeScale,29*eyeScale,0,0,Math.PI*2);ctx.fill();circle(ex-7*eyeScale,ey,10*eyeScale,"#253d54");circle(ex-7*eyeScale,ey,4*eyeScale,"#101a23");
 ctx.fillStyle="#ffb66d";ctx.beginPath();ctx.arc(ex+43*eyeScale,ey,5*eyeScale,-Math.PI/2,Math.PI/2);ctx.stroke();arrow(ex+69*eyeScale,ey,ex+91*eyeScale,ey,"#8ebcff",1.5);
 text("cornea",ex-20*eyeScale,ey-47*eyeScale,"#d6e0df",8);text("iris",ex-30*eyeScale,ey+43*eyeScale,"#d6e0df",8);text("pupil",ex-6*eyeScale,ey+19*eyeScale,"#d6e0df",8);text("lens",ex+2*eyeScale,ey-43*eyeScale,"#d6e0df",8);text("retina",ex+46*eyeScale,ey+32*eyeScale,"#d6e0df",8);text("optic nerve",ex+95*eyeScale,ey+4*eyeScale,"#d6e0df",8);text("Light focuses on retina",ex,ey+75*eyeScale,"#bac8ca",9,"center");
}
function drawNatural(v,w,h){
 if(v.demo==="Earthquake waves"){const ground=h*.57;line(w*.08,ground,w*.92,ground,"#85a19f",2);ctx.fillStyle="#293a40";ctx.fillRect(w*.08,ground+3,w*.84,h*.36);const fx=w*.42,fy=ground+65;circle(fx,fy,7,"#ffb66d");circle(fx,fy,3,"#fff0c0");circle(fx,ground,5,"#ff8c82");text("focus · underground",fx,fy+21,"#d0d9d9",9,"center");text("epicentre",fx,ground-13,"#ffc3ac",9,"center");for(let i=0;i<4;i++){const r=(state.elapsed*38+i*33)%130;ctx.beginPath();ctx.strokeStyle=`rgba(255,182,109,${Math.max(.1,1-r/140)})`;ctx.lineWidth=2;ctx.arc(fx,fy,r,Math.PI*1.1,Math.PI*1.9);ctx.stroke();}text("seismic waves travel out from the focus",w*.67,h*.84,"#c3cdce",9,"center");}
 else if(v.demo==="Lightning"){const ground=h*.79;ctx.fillStyle="#37424a";ctx.beginPath();ctx.ellipse(w*.52,h*.25,w*.23,33,0,0,Math.PI*2);ctx.fill();text("charged storm cloud",w*.52,h*.25+4,"#e0e6e3",9,"center");for(let i=0;i<7;i++){const x=w*.35+i*w*.05,y=h*.45+Math.sin(i+state.elapsed*2)*12;ctx.fillStyle=i%2?"#ff9992":"#a8bfff";text(i%2?"−":"+",x,y,"#f4cc92",14,"center");}ctx.beginPath();ctx.moveTo(w*.5,h*.32);ctx.lineTo(w*.46,h*.48);ctx.lineTo(w*.53,h*.49);ctx.lineTo(w*.47,h*.68);ctx.strokeStyle="#f8df98";ctx.lineWidth=3;ctx.stroke();line(0,ground,w,ground,"#83938f",2);text("Lightning safety: go indoors · avoid water & open areas",w*.5,h*.92,"#ffcc91",9,"center");}
 else{const cx=w*.34,cy=h*.47;circle(cx,cy,35,"#b08c6b");text("rub",cx,cy+5,"#19252b",10,"center");for(let i=0;i<v.charge;i++){const a=i*Math.PI*2/v.charge;text(i%2?"+":"−",cx+Math.cos(a)*63,cy+Math.sin(a)*52,"#ffcf7e",12,"center");}const x2=w*.72;circle(x2,cy,27,v.relation.startsWith("Unlike")?"#8ebcff":"#d690d6");circle(x2-53,cy,27,"#d690d6");text(v.relation.startsWith("Unlike")?"+":"+",x2-53,cy+5,"#fff",12,"center");text(v.relation.startsWith("Unlike")?"−":"+",x2,cy+5,"#fff",12,"center");arrow(x2-22,cy-37,x2-43,cy-37,v.relation.startsWith("Unlike")?"#69e0c1":"#ff9086",1.7);text(v.demo==="Charging by rubbing"?"charge transfer by rubbing":`${v.relation} charges ${v.relation.startsWith("Unlike")?"attract":"repel"}`,w*.52,h*.82,"#c7d3d3",10,"center");}
}
document.querySelectorAll(".nav-button").forEach(btn=>btn.addEventListener("click",()=>{if(btn.dataset.grade==="home"){state.page="home";state.running=false;renderHome();renderNav();}else openGrade(Number(btn.dataset.grade));}));
$("home-button").addEventListener("click",()=>{state.page="home";state.running=false;renderHome();renderNav();});
window.addEventListener("resize",()=>draw());
renderHome();renderNav();
})();
